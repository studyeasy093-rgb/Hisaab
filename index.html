<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8ECF1">
<title>Hisaab — Day Points</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular","Roboto Mono","Droid Sans Mono",Menlo,Consolas,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  --bg:#E8ECF1; --surface:#FFFFFF; --surface2:#F1F4F8; --ink:#141C2B; --muted:#5A667A; --line:#D5DCE5;
  --accent:#2446C9; --accent-ink:#FFFFFF; --accent-soft:#E2E8FB;
  --good:#0E8A5C; --mid:#B5770A; --bad:#C23A2E;
  --good-bg:#DDF3EA; --mid-bg:#FBEFD6; --bad-bg:#F9E1DE;
  --scrim:rgba(14,20,32,.42);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1420; --surface:#161E2D; --surface2:#1D2739; --ink:#E4E9F2; --muted:#8C98AE; --line:#29344A;
    --accent:#8DA3FF; --accent-ink:#0E1420; --accent-soft:#223056;
    --good:#39C98C; --mid:#F0B43C; --bad:#FF6F61;
    --good-bg:rgba(57,201,140,.14); --mid-bg:rgba(240,180,60,.14); --bad-bg:rgba(255,111,97,.14);
    --scrim:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1420; --surface:#161E2D; --surface2:#1D2739; --ink:#E4E9F2; --muted:#8C98AE; --line:#29344A;
  --accent:#8DA3FF; --accent-ink:#0E1420; --accent-soft:#223056;
  --good:#39C98C; --mid:#F0B43C; --bad:#FF6F61;
  --good-bg:rgba(57,201,140,.14); --mid-bg:rgba(240,180,60,.14); --bad-bg:rgba(255,111,97,.14);
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);-webkit-tap-highlight-color:transparent;min-height:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.top .wrap{display:flex;align-items:center;gap:8px;height:58px}
.brand{flex:1;min-width:0}
.brand b{display:block;font:700 20px/1 var(--mono);letter-spacing:-.02em}
.brand span{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
.ibtn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.ibtn:hover{background:var(--surface2)}
.ibtn svg{width:22px;height:22px}

main{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.tab{display:none}
.tab.on{display:block}

/* Buttons & form */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 16px;border-radius:11px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:14.5px}
.btn svg{width:18px;height:18px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn.sm{height:36px;padding:0 12px;font-size:13.5px;border-radius:9px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.txtbtn{color:var(--accent);font-weight:600;font-size:13.5px;padding:6px 2px}
label.f{display:block;margin:0 0 14px;font-size:13px;font-weight:600;color:var(--muted)}
label.f > span{display:block;margin-bottom:6px}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;height:46px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font:500 15px var(--sans)}
input[type=number]{font-family:var(--mono);font-weight:700}
textarea{height:120px;padding:10px 12px;font:13px/1.4 var(--mono);resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12.5px;color:var(--muted);margin:-6px 0 14px}
.check{display:flex;align-items:center;gap:10px;font-size:14px;margin:0 0 14px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.switch-row div b{display:block;font-weight:600;font-size:14.5px}
.switch-row div span{display:block;font-size:12.5px;color:var(--muted)}
.switch-row input{width:22px;height:22px;accent-color:var(--accent);flex:none}

/* Chips */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:500;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip em{font-style:normal;font-family:var(--mono);font-weight:700;margin-left:4px}

/* Wake card */
.wake{margin-top:6px;display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.wk-l{font-size:12.5px;color:var(--muted)}
.wk-t{font:700 22px/1.2 var(--mono);letter-spacing:-.02em}
.wk-d{font-size:12.5px;color:var(--muted)}
.wk-b{grid-column:1/-1;display:flex;gap:8px;margin-top:10px}
.wk-b .btn{flex:1}
.banner{margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--mid-bg);color:var(--ink);font-size:13.5px;display:flex;gap:10px;align-items:center}
.banner .btn{flex:none}

/* Dial */
.dialbox{margin:18px 0 6px;display:flex;flex-direction:column;align-items:center}
.dial{position:relative;width:260px;height:260px}
.dial svg{width:100%;height:100%}
.dial .tick{stroke:var(--muted);stroke-width:1.4;opacity:.55}
.dial .tick.maj{stroke:var(--ink);stroke-width:2;opacity:.8}
.dial .track{stroke:var(--surface2);fill:none}
.dial .prog{fill:none;stroke-linecap:round;transition:stroke-dasharray .6s ease}
.dial .zone{fill:none;stroke-width:4}
.dial .tlabel{font:600 10.5px var(--sans);fill:var(--muted)}
.dial-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-top:8px}
.dial-n{font:700 52px/1 var(--mono);letter-spacing:-.04em}
.dial-n small{font-size:15px;margin-left:4px;letter-spacing:0;color:var(--muted)}
.dial-v{margin-top:8px;padding:4px 12px;border-radius:999px;font-weight:700;font-size:13px}
.v-productive{background:var(--good-bg);color:var(--good)}
.v-average{background:var(--mid-bg);color:var(--mid)}
.v-waste{background:var(--bad-bg);color:var(--bad)}
.dial-sub{margin:-18px 0 12px;font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);width:100%;margin-top:6px;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.stat{padding:10px 12px}
.stat+.stat{border-left:1px solid var(--line)}
.stat b{display:block;font:700 17px/1.2 var(--mono)}
.stat span{font-size:12px;color:var(--muted)}

/* Today list */
.listbar{display:flex;align-items:center;justify-content:space-between;margin:18px 0 6px}
.listbar h2{margin:0;font-size:17px;font-weight:700}
.cat{margin-top:10px;border-radius:14px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.cat-h{width:100%;display:flex;align-items:center;gap:10px;padding:13px 14px;text-align:left}
.cat-h .nm{flex:1;min-width:0;font-weight:600;font-size:15px}
.cat-h .ct{font:700 12.5px var(--mono);color:var(--muted)}
.cat-h .cp{font:700 12.5px var(--mono);color:var(--accent);min-width:44px;text-align:right}
.chev{width:18px;height:18px;color:var(--muted);transition:transform .2s}
.cat.open .chev{transform:rotate(90deg)}
.bar{height:3px;background:var(--surface2)}
.bar i{display:block;height:100%;background:var(--accent)}
.row{display:grid;grid-template-columns:30px 1fr auto 40px;align-items:center;gap:10px;padding:9px 12px 9px 14px;border-top:1px solid var(--line)}
.row.live{background:var(--accent-soft)}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.chk svg{width:16px;height:16px}
.chk.on{background:var(--good);border-color:var(--good);color:#fff}
.rmain{text-align:left;min-width:0;padding:3px 0}
.tname{display:block;font-family:var(--mono);font-weight:700;font-size:14.5px;line-height:1.3;letter-spacing:-.01em;overflow-wrap:anywhere}
.tmeta{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.tmeta .warn{color:var(--mid);font-weight:600}
.row.done .tname{color:var(--muted)}
.row.skip .tname{color:var(--muted);text-decoration:line-through}
.tpts{font:700 13px var(--mono);color:var(--muted);opacity:.6;text-align:right}
.tpts.has{color:var(--good);opacity:1}
.go{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink)}
.go svg{width:18px;height:18px}
.go.measure{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px}
.addrow{display:flex;gap:8px;margin-top:14px}
.addrow .btn{flex:1}

/* Onboarding */
.onb{margin-top:10px;padding:22px 18px;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.onb h2{margin:0 0 6px;font:700 24px/1.2 var(--mono);letter-spacing:-.02em}
.onb p{margin:0 0 18px;color:var(--muted)}
.rules{margin-top:18px;border-top:1px solid var(--line);padding-top:14px;display:grid;gap:8px;font-size:13.5px}
.rules div{display:flex;justify-content:space-between;gap:10px}
.rules b{font-family:var(--mono)}

/* Focus */
.fx{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:14px}
.fx-mode{font-size:13px;font-weight:600;color:var(--accent)}
.fx-task{margin-top:6px;font:700 22px/1.25 var(--mono);letter-spacing:-.02em;max-width:100%;overflow-wrap:anywhere}
.fx-cat{margin-top:4px;font-size:13px;color:var(--muted)}
.ring{position:relative;width:min(300px,80vw);aspect-ratio:1;margin:22px 0 18px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .rt{fill:none;stroke:var(--line);stroke-width:14;opacity:.7}
.ring .rp{fill:none;stroke:var(--accent);stroke-width:14;stroke-linecap:round}
.ring .rtk{stroke:var(--line);stroke-width:2}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.clock{font:700 50px/1 var(--mono);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.clock-sub{margin-top:8px;font-size:13px;color:var(--muted)}
.fx-btns{display:flex;gap:10px;width:100%;max-width:380px}
.fx-btns .btn{flex:1;height:52px;font-size:15.5px}
.fx-btns2{display:flex;gap:16px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.idle h2{margin:14px 0 4px;font:700 22px var(--mono);letter-spacing:-.02em}
.idle > p{margin:0 0 14px;color:var(--muted);font-size:14px}
.idle h3{margin:22px 0 8px;font-size:15px;font-weight:700;display:flex;justify-content:space-between}
.idle h3 span{font:700 13px var(--mono);color:var(--muted)}
.plist{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.prow{width:100%;display:grid;grid-template-columns:1fr auto 36px;gap:10px;align-items:center;padding:10px 12px 10px 14px;text-align:left;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .go{width:36px;height:36px;border-radius:10px}
.prow .pm{font:700 12.5px var(--mono);color:var(--muted);text-align:right}

/* Mini timer */
#mini{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:35;padding:0 12px}
#mini .in{max-width:536px;margin:0 auto;display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);border-radius:14px;padding:6px 6px 6px 14px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
#mini .mm{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;height:40px}
#mini .mn{flex:1;min-width:0;font:700 13.5px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .mc{font:700 16px var(--mono);font-variant-numeric:tabular-nums}
#mini .mp{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:rgba(127,127,127,.25)}
#mini .mp svg{width:18px;height:18px}

/* Library */
.libbar{display:flex;gap:8px;margin:8px 0 4px}
.libbar input{flex:1}
.lcat{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.lcat-h{display:flex;align-items:center}
.lcat-h .tg{flex:1;display:flex;align-items:center;gap:10px;padding:13px 6px 13px 14px;text-align:left;min-width:0}
.lcat-h .tg .nm{flex:1;font-weight:600}
.lcat-h .tg .ct{font:700 12.5px var(--mono);color:var(--muted)}
.lcat.open .chev{transform:rotate(90deg)}
.lrow{width:100%;display:block;text-align:left;padding:10px 14px;border-top:1px solid var(--line)}
.lrow .rp{display:flex;gap:8px;flex-wrap:wrap;margin-top:3px;font-size:12.5px;color:var(--muted)}
.lrow .rp b{font:700 12px var(--mono);color:var(--ink)}
.lrow .rp .un{color:var(--mid);font-weight:600}
.laddr{width:100%;padding:11px 14px;border-top:1px solid var(--line);text-align:left;color:var(--accent);font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center}
.laddr svg{width:16px;height:16px}

/* Calendar */
.cal{margin-top:8px;padding:12px 10px 10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;touch-action:pan-y}
.cal-h{display:flex;align-items:center;gap:6px;padding:0 2px 10px}
.cal-h h2{flex:1;margin:0;text-align:center;font:700 17px var(--mono);letter-spacing:-.02em}
.cal-h .ibtn{width:38px;height:38px}
.cal-h .ibtn.prev svg{transform:rotate(180deg)}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-w{text-align:center;font-size:11.5px;font-weight:600;color:var(--muted);padding-bottom:2px}
.cd{position:relative;aspect-ratio:1/1.08;border-radius:10px;border:1.5px solid transparent;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:0}
.cd .dn{position:absolute;top:4px;left:6px;font-size:11px;font-weight:600;color:var(--muted)}
.cd .sc{font:700 13px var(--mono);letter-spacing:-.03em;margin-top:6px}
.cd.pad{background:none}
.cd.fut{opacity:.4}
.cd.today{border-color:var(--ink)}
.cd.v-productive{background:var(--good-bg);border-color:var(--good)}
.cd.v-productive .sc{color:var(--good)}
.cd.v-average{background:var(--mid-bg);border-color:var(--mid)}
.cd.v-average .sc{color:var(--mid)}
.cd.v-waste{background:var(--bad-bg);border-color:var(--bad)}
.cd.v-waste .sc{color:var(--bad)}
.cd.live{border:1.5px dashed var(--accent);background:var(--accent-soft)}
.cd.live .sc{color:var(--accent)}
.cal-leg{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin-top:10px;font-size:12px;color:var(--muted)}
.cal-leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.msum{display:grid;grid-template-columns:repeat(4,1fr);margin-top:10px;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.msum div{padding:10px 6px;text-align:center}
.msum div+div{border-left:1px solid var(--line)}
.msum b{display:block;font:700 17px var(--mono)}
.msum span{font-size:11.5px;color:var(--muted)}
.hsec{margin:22px 0 4px;font-size:15px;font-weight:700}

/* History */
.hchart{margin-top:8px;padding:14px 12px 8px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.hchart svg{width:100%;height:auto}
.hchart .gl{stroke-dasharray:3 4;stroke-width:1}
.hchart text{font:600 9.5px var(--sans);fill:var(--muted)}
.hsum{display:grid;grid-template-columns:repeat(4,1fr);margin-top:10px;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.hsum div{padding:10px;text-align:center}
.hsum div+div{border-left:1px solid var(--line)}
.hsum b{display:block;font:700 17px var(--mono)}
.hsum span{font-size:11.5px;color:var(--muted)}
.hlist{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.hrow{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
.hrow .hd{flex:1;min-width:0}
.hrow .hd b{display:block;font-weight:600}
.hrow .hd span{display:block;font-size:12.5px;color:var(--muted)}
.hrow .hs{text-align:right}
.hrow .hs b{display:block;font:700 16px var(--mono)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;margin-top:3px}

/* Nav */
nav.bn{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bn .wrap{display:grid;grid-template-columns:repeat(4,1fr);height:62px;padding:0 6px}
nav.bn button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);position:relative}
nav.bn button svg{width:22px;height:22px}
nav.bn button.on{color:var(--accent)}
nav.bn button .dot{position:absolute;top:10px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--bad)}

/* Sheet */
#sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
#sheet .scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .2s}
#sheet .panel{position:relative;width:100%;max-width:560px;max-height:88vh;max-height:88dvh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .22s ease-out;overscroll-behavior:contain}
#sheet.open .scrim{opacity:1}
#sheet.open .panel{transform:none}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 12px}
.sh-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px}
.sh-h h3{flex:1;margin:0;font-size:18px;font-weight:700;line-height:1.3}
.sh-h h3.mono{font-family:var(--mono);letter-spacing:-.01em}
.sh-h p{margin:4px 0 0;font-size:13px;color:var(--muted);font-weight:400}
.sh-x{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);flex:none}
.sh-x svg{width:18px;height:18px}
.acts{display:grid;gap:8px}
.act{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border-radius:12px;background:var(--surface2);text-align:left;font-weight:600;font-size:14.5px}
.act svg{width:20px;height:20px;flex:none;color:var(--accent)}
.act small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.act.danger{color:var(--bad)}
.act.danger svg{color:var(--bad)}
.sh-foot{display:flex;gap:10px;margin-top:6px}
.sh-foot .btn{flex:1}
.days{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 14px}
.days button{width:42px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-size:13px;font-weight:600}
.days button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sect{margin:22px 0 4px;font-size:13px;font-weight:700;color:var(--accent)}
.big{font:700 34px/1.1 var(--mono);letter-spacing:-.03em;text-align:center;margin:6px 0 16px}
.ilist{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
.irow{display:flex;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line);font-size:13px}
.irow:first-child{border-top:0}
.irow .tname{flex:1;font-size:13.5px}
.irow .v{font:700 12.5px var(--mono);color:var(--muted)}
.irow .v.g{color:var(--good)}

#toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:80;max-width:min(92vw,480px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (min-width:600px){.row{padding-left:16px}}
</style>
</head>
<body>
<header class="top" id="top">
  <div class="wrap">
    <div class="brand"><b>Hisaab</b><span id="hdr-sub">Day points ledger</span></div>
    <button class="ibtn" data-act="settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    <button class="ibtn" data-act="theme" id="themeBtn" aria-label="Switch theme"></button>
  </div>
</header>

<main class="wrap">
  <section class="tab on" id="tab-today"></section>
  <section class="tab" id="tab-focus"></section>
  <section class="tab" id="tab-tasks">
    <div class="libbar">
      <input type="text" id="libq" placeholder="Search tasks" autocomplete="off" aria-label="Search tasks">
    </div>
    <div class="addrow">
      <button class="btn ghost" data-act="add-cat"><span data-i="plus"></span>New category</button>
      <button class="btn" data-act="add-task"><span data-i="plus"></span>New task</button>
    </div>
    <div id="lib-list"></div>
  </section>
  <section class="tab" id="tab-history"></section>
</main>

<div id="mini" hidden>
  <div class="in">
    <button class="mm" data-act="tab" data-tab="focus" aria-label="Open timer"><span class="mn" id="mini-name"></span><span class="mc" data-tclock></span></button>
    <button class="mp" data-act="t-pp" id="mini-pp" aria-label="Pause or resume"></button>
  </div>
</div>

<nav class="bn" aria-label="Sections">
  <div class="wrap">
    <button data-act="tab" data-tab="today" class="on"><span data-i="today"></span>Today</button>
    <button data-act="tab" data-tab="focus"><span data-i="timer"></span>Focus<i class="dot" id="navdot" hidden></i></button>
    <button data-act="tab" data-tab="tasks"><span data-i="list"></span>Tasks</button>
    <button data-act="tab" data-tab="history"><span data-i="cal"></span>Progress</button>
  </div>
</nav>

<div id="sheet" hidden>
  <div class="scrim" data-act="close"></div>
  <div class="panel" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheet-body"></div></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ---------- Seed: your checklist ---------- */
const SEED = [
 ["Daily Routine",["Wake up on time","Wash utensils and heat water","Drink water","Brush teeth","Plan the day","Wash baby bottles","Toilet","Prepare Tea"]],
 ["Hygiene & Self-care",["Bath/shower","Mouth gargle","Skincare","Hair care","Shave/grooming","Nail trim","Change clothes","Moisturise"]],
 ["Meals & Food",["Breakfast","Lunch","Dinner","Pack lunch/tiffin","Cook","Wash dishes","Plan weekly menu","Check groceries"]],
 ["Sleep & Rest",["Sleep by fixed time","7–8 hrs sleep","Short afternoon nap","Change bedsheets"]],
 ["Health & Wellness",["Take medicines/supplements","Check BP/weight","Doctor/dental appointments","Health records upkeep"]],
 ["Exercise & Movement",["Morning walk","Yoga","Stretching","Workout/gym","Excercises","Evening walk"]],
 ["Commute & Travel",["Plan trips","Book tickets","Pack bag"]],
 ["Deep Work / Study",["Focused session (no phone)","Read/revise notes","Practice problems","Write/summarise","Review what was learned"]],
 ["Learning & Growth",["Read a book","Online course","Learn a new word/skill","Podcasts","Journaling","Practice a language","Review goals"]],
 ["Household & Chores",["Sweep/mop","Dusting","Laundry","Fold & iron clothes","Clean kitchen","Clean bathroom","Take out trash","Water plants","Small repairs"]],
 ["Errands & Shopping",["Grocery shopping","Vegetables/milk","Pharmacy","Bank/post office","Pick up/return items","Household supplies restock"]],
 ["Finance & Admin",["Pay bills (electricity, phone, internet)","Track expenses","Budget review","Check bank statements","Investments","Tax/insurance paperwork","File receipts"]],
 ["Family & Kids",["School drop/pick-up","Help with homework","Pack school bag","Check school messages","Quality time","Call parents/relatives","Attend school events"]],
 ["Social & Relationships",["Call/message a friend","Wish birthdays/anniversaries","Reply to messages","Meet someone","Spouse/partner time","Visit relatives"]],
 ["Digital & Screen Time",["Clear inbox","Delete junk files/photos","Backup phone","Update apps","Organise files"]],
 ["Mindfulness & Spiritual",["Meditation","Prayer/puja","Mantra japa","Gratitude journal","Scripture reading","Breathing exercises","Evening reflection"]],
 ["Hobbies & Creativity",["Drawing/painting","Music practice","Writing","Crafts","Gardening","Photography","Cooking something new"]],
 ["Entertainment & Leisure",["Watch a show/movie","Read for fun","Games","Music","Outing","Walk in nature"]],
 ["Admin & Planning",["Weekly planning","Update calendar","Review to-dos","Renew documents (ID, licence, insurance)","Organise papers","Set reminders"]],
 ["Personal Time",["Solitude/quiet time","Hobby time","Nap","Self-reflection"]],
 ["Office Commute",["Dress up for office","Carry ID, keys, wallet, phone, charger","Time in train while going","Time in Return commute"]]
];

/* ---------- Icons ---------- */
const sv = (p, f) => `<svg viewBox="0 0 24 24" fill="${f?'currentColor':'none'}" stroke="${f?'none':'currentColor'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I = {
  play: sv('<path d="M8 5.5v13a1 1 0 0 0 1.5.9l10.2-6.5a1 1 0 0 0 0-1.8L9.5 4.6A1 1 0 0 0 8 5.5z"/>',1),
  pause: sv('<rect x="6.5" y="5" width="4" height="14" rx="1.2"/><rect x="13.5" y="5" width="4" height="14" rx="1.2"/>',1),
  watch: sv('<circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V10M10 2.5h4M18.5 6.5l1.5-1.5"/>'),
  check: sv('<path d="M5 12.5l4.5 4.5L19 7.5" stroke-width="3"/>'),
  plus: sv('<path d="M12 5v14M5 12h14"/>'),
  chev: sv('<path d="M9 6l6 6-6 6"/>'),
  close: sv('<path d="M6 6l12 12M18 6L6 18"/>'),
  more: sv('<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',1),
  sun: sv('<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/>'),
  moon: sv('<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>'),
  today: sv('<path d="M3 18h18M6.5 18a5.5 5.5 0 0 1 11 0M12 4.5v3M4.6 9.6l2 1.6M19.4 9.6l-2 1.6"/>'),
  timer: sv('<circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5l3-3M10 2.5h4"/>'),
  list: sv('<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01" stroke-width="3"/>'),
  chart: sv('<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'),
  cal: sv('<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01" stroke-width="2.6"/>'),
  stop: sv('<rect x="6" y="6" width="12" height="12" rx="2"/>',1),
  flag: sv('<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>'),
  skip: sv('<path d="M5 5l9 7-9 7V5zM18 5v14"/>'),
  undo: sv('<path d="M4 9h11a5 5 0 0 1 0 10H9"/><path d="M8 5L4 9l4 4"/>'),
  edit: sv('<path d="M4 20h4L19 9l-4-4L4 16v4z"/>'),
  trash: sv('<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'),
  up: sv('<path d="M12 19V5M6 11l6-6 6 6"/>'),
  down: sv('<path d="M12 5v14M6 13l6 6 6-6"/>'),
  copy: sv('<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>'),
  sunrise: sv('<path d="M3 18h18M6.5 18a5.5 5.5 0 0 1 11 0M12 3v6M9 6l3-3 3 3"/>')
};

/* ---------- Helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let uidN = 0;
const uid = () => Date.now().toString(36) + (++uidN).toString(36) + Math.random().toString(36).slice(2,6);
const pad = n => String(n).padStart(2,'0');
const ymd = d => { d = new Date(d); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const hm = d => { d = new Date(d); return pad(d.getHours())+':'+pad(d.getMinutes()); };
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const dayDiff = (a,b) => Math.round((parseYmd(b) - parseYmd(a)) / 86400000);
const toTs = (date, time) => { const [y,m,d] = date.split('-').map(Number); const [h,mi] = time.split(':').map(Number); return new Date(y, m-1, d, h, mi).getTime(); };
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fmtTime = ts => new Date(ts).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true});
const fmtDate = ts => new Date(ts).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const fmtDur = ms => { const m = Math.max(0, Math.floor(ms/60000)); const h = Math.floor(m/60); return h ? `${h}h ${m%60}m` : `${m}m`; };
const fmtClock = ms => { const t = Math.max(0, Math.floor(ms/1000)); const h = Math.floor(t/3600), m = Math.floor(t%3600/60), s = t%60; return (h ? h+':'+pad(m) : pad(m)) + ':' + pad(s); };
const fp = n => (Math.round((n||0)*100)/100).toFixed(2);

/* ---------- State ---------- */
const KEY = 'hisaab.v1';
let S;
const defaults = () => ({
  v:2,
  settings:{ mpp:14.4, prod:75, avg:50, requireFocus:true, sound:true, vibrate:true, awake:true, theme:null },
  categories:[], tasks:[], cycles:[], timer:null,
  ui:{ open:{}, libOpen:{}, filter:'pending' }
});
function seed(s){
  SEED.forEach(([cat, list]) => {
    const c = { id:uid(), name:cat }; s.categories.push(c);
    list.forEach(n => s.tasks.push({ id:uid(), catId:c.id, name:n, minutes:null, repeat:{type:'daily'}, archived:false, created:Date.now() }));
  });
}
function load(){
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch(e){}
  if (raw) {
    try {
      const d = JSON.parse(raw), def = defaults();
      S = Object.assign(def, d);
      S.settings = Object.assign(defaults().settings, d.settings||{});
      S.ui = Object.assign(defaults().ui, d.ui||{});
      migrate(d);
      S.cycles.forEach(c => { if (c.end && !c.final) { c.items = c.items || []; c.final = finalFromItems(c); } });
      return;
    } catch(e){}
  }
  S = defaults(); seed(S); save(true);
}
/* v1 used 36 min = 1 pt with a percent score. v2: 24 h (1440 min) = 100 pts, score = points total. */
function migrate(d){
  if ((d.v||1) >= 2) return;
  const oldMpp = (d.settings && d.settings.mpp) || 36, k = oldMpp / 14.4;
  S.settings.mpp = 14.4; delete S.settings.mode;
  S.cycles.forEach(c => {
    if (!c.items) return;
    c.items.forEach(i => { i.full = i.min ? i.min / 14.4 : 0; i.pts = (i.pts||0) * k; });
    c.final = finalFromItems(c);
  });
  S.v = 2; save(true);
}
const ppd = () => 1440 / S.settings.mpp;
const fmtMpp = m => String(Math.round(m*100)/100);
let saveT = null;
function save(now){
  clearTimeout(saveT);
  const f = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };
  if (now) f(); else saveT = setTimeout(f, 120);
}

/* ---------- Domain ---------- */
const cur = () => { const c = S.cycles[S.cycles.length-1]; return c && !c.end ? c : null; };
const catById = id => S.categories.find(c => c.id === id);
const taskById = id => S.tasks.find(t => t.id === id);
const catName = t => { const c = t && catById(t.catId); return c ? c.name : ''; };

function scheduled(t, date){
  const r = t.repeat || {type:'daily'};
  switch (r.type) {
    case 'daily': return true;
    case 'weekly': return (r.days||[]).includes(parseYmd(date).getDay());
    case 'interval': { const d = dayDiff(r.anchor||date, date); return d >= 0 && d % Math.max(1, r.every||1) === 0; }
    case 'once': return r.date === date;
    default: return false;
  }
}
function repeatText(r){
  r = r || {type:'daily'};
  switch (r.type) {
    case 'daily': return 'Every day';
    case 'weekly': return (r.days||[]).length === 7 ? 'Every day' : (r.days||[]).slice().sort().map(d => DOW[d]).join(', ') || 'No days picked';
    case 'interval': return `Every ${r.every||1} days`;
    case 'once': return 'Only on ' + (r.date ? fmtDate(parseYmd(r.date)) : '—');
    default: return 'Not repeating';
  }
}
function cycleTasks(c){
  const d = ymd(c.start);
  const order = new Map(S.categories.map((x,i) => [x.id, i]));
  return S.tasks.filter(t => !t.archived && (scheduled(t, d) || (c.entries[t.id] && c.entries[t.id].added)))
    .sort((a,b) => (order.get(a.catId)??999) - (order.get(b.catId)??999));
}
const blank = () => ({done:false, via:false, sec:0, skip:false});
function ent(c, id, create){
  let e = c.entries[id];
  if (!e && create) e = c.entries[id] = blank();
  return e || blank();
}
const taskPts = t => t && t.minutes ? t.minutes / S.settings.mpp : 0;
function earnedFor(t, e){
  if (!t.minutes || e.skip) return 0;
  if (e.done && (!S.settings.requireFocus || e.via)) return taskPts(t);
  return Math.min(e.sec/60, t.minutes) / S.settings.mpp;
}
function verdictOf(x){ const s = S.settings; return x >= s.prod ? 'productive' : x >= s.avg ? 'average' : 'waste'; }
const VLABEL = {productive:'Productive', average:'Average', waste:'Waste'};
function scoreOf(earned, lengthMin){
  const cap = lengthMin / S.settings.mpp, score = earned;
  return { score, cap, verdict:verdictOf(score) };
}
function summarize(c){
  if (c.final) return c.final;
  let earned=0, possible=0, done=0, total=0, sec=0, unmeasured=0;
  cycleTasks(c).forEach(t => {
    const e = ent(c, t.id); sec += e.sec;
    if (e.skip) return;
    total++; if (e.done) done++;
    if (!t.minutes) { unmeasured++; return; }
    possible += taskPts(t); earned += earnedFor(t, e);
  });
  const elapsed = (Date.now() - c.start) / 60000;
  const lengthMin = Math.max(1440, elapsed);
  return Object.assign({earned, possible, done, total, sec, unmeasured, lengthMin, elapsed, live:true}, scoreOf(earned, lengthMin));
}
function finalFromItems(c){
  let earned=0, possible=0, done=0, total=0, sec=0, unmeasured=0;
  (c.items||[]).forEach(i => {
    sec += i.sec; if (i.skip) return;
    total++; if (i.done) done++;
    if (!i.min) { unmeasured++; return; }
    possible += i.full; earned += i.pts;
  });
  const lengthMin = (c.end - c.start) / 60000;
  return Object.assign({earned, possible, done, total, sec, unmeasured, lengthMin, elapsed:lengthMin, live:false}, scoreOf(earned, lengthMin));
}
function closeCycle(c, endTs){
  c.end = endTs;
  c.items = cycleTasks(c).map(t => {
    const e = ent(c, t.id);
    return { id:t.id, name:t.name, cat:catName(t), min:t.minutes||0, full:taskPts(t), pts:earnedFor(t,e), done:e.done, skip:e.skip, sec:e.sec };
  });
  c.final = finalFromItems(c);
}
const fmtScore = f => (Math.round(f.score*10)/10).toFixed(1) + ' pts';

/* ---------- Timer ---------- */
const tElapsed = () => { const T = S.timer; if (!T) return 0; return T.acc + (T.running ? Date.now() - T.at : 0); };
let AC = null, WL = null;
function unlockAudio(){
  try {
    if (!AC) { const A = window.AudioContext || window.webkitAudioContext; if (A) AC = new A(); }
    if (AC && AC.state === 'suspended') AC.resume();
  } catch(e){}
}
function chime(){
  if (S.settings.vibrate && navigator.vibrate) { try { navigator.vibrate([220,110,220,110,420]); } catch(e){} }
  if (!S.settings.sound || !AC) return;
  try {
    const t0 = AC.currentTime;
    [0, .3, .6].forEach((d, i) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine'; o.frequency.value = i === 2 ? 1175 : 880;
      g.gain.setValueAtTime(0.0001, t0+d);
      g.gain.exponentialRampToValueAtTime(0.35, t0+d+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+d+0.26);
      o.connect(g); g.connect(AC.destination); o.start(t0+d); o.stop(t0+d+0.3);
    });
  } catch(e){}
}
async function keepAwake(){
  if (!S.settings.awake || !S.timer || !S.timer.running || WL) return;
  try { if ('wakeLock' in navigator) { WL = await navigator.wakeLock.request('screen'); WL.addEventListener('release', () => { WL = null; }); } } catch(e){ WL = null; }
}
function letSleep(){ try { WL && WL.release(); } catch(e){} WL = null; }

function startFocus(id){
  const c = cur();
  if (!c) { toast('Log your wake-up time first'); showTab('today'); return; }
  if (S.timer) { toast('A timer is already running'); showTab('focus'); return; }
  const t = taskById(id); if (!t) return;
  if (!t.minutes) return startWatch(id);
  const e = ent(c, id, true);
  if (e.done) { toast('Already done today'); return; }
  if (e.skip) e.skip = false;
  if (!cycleTasks(c).includes(t)) e.added = true;
  const leftSec = Math.max(60, t.minutes*60 - e.sec);
  S.timer = { mode:'focus', tid:id, cid:c.id, at:Date.now(), acc:0, running:true, target:leftSec*1000 };
  unlockAudio(); keepAwake(); save(true); renderAll(); showTab('focus');
}
function startWatch(id){
  if (S.timer) { toast('A timer is already running'); showTab('focus'); return; }
  const c = cur();
  S.timer = { mode:'watch', tid:id||null, cid:c?c.id:null, at:Date.now(), acc:0, running:true };
  unlockAudio(); keepAwake(); save(true); renderAll(); showTab('focus');
}
function pauseT(){ const T = S.timer; if (!T || !T.running) return; T.acc += Date.now() - T.at; T.running = false; letSleep(); save(true); renderFocus(); updateTimer(); }
function resumeT(){ const T = S.timer; if (!T || T.running) return; T.at = Date.now(); T.running = true; unlockAudio(); keepAwake(); save(true); renderFocus(); updateTimer(); }
function endFocus(markDone){
  const T = S.timer; if (!T) return;
  const el = Math.min(tElapsed(), T.target);
  const c = S.cycles.find(x => x.id === T.cid);
  if (c && !c.end) { const e = ent(c, T.tid, true); e.sec += el/1000; if (markDone) { e.done = true; e.via = true; e.skip = false; } }
  S.timer = null; letSleep(); save(true); renderAll();
}
function discardT(){ S.timer = null; letSleep(); save(true); renderAll(); }

function tick(){
  const T = S.timer;
  if (T && T.mode === 'focus' && T.running && tElapsed() >= T.target) {

/* ---------- Dial ---------- */
function dialSVG(sum){
  const s = S.settings, max = 100, val = Math.max(0, Math.min(max, sum.score));
  const cx = 130, cy = 130, R = 100;
  const ang = v => (135 + v/max*270) * Math.PI/180;
  const pt = (v, r) => [cx + r*Math.cos(ang(v)), cy + r*Math.sin(ang(v))];
  const arc = (v0, v1, r) => { const [x0,y0] = pt(v0,r), [x1,y1] = pt(v1,r); const lg = (v1-v0)/max*270 > 180 ? 1 : 0; return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${lg} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`; };
  let ticks = '';
  for (let v = 0; v <= 100; v += 2) {
    const maj = v % 10 === 0, [x1,y1] = pt(v, R+14), [x2,y2] = pt(v, maj ? R+24 : R+19);
    ticks += `<line class="tick${maj?' maj':''}" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`;
  }
  const avg = Math.min(s.avg, 100), prod = Math.min(s.prod, 100);
  const col = sum.verdict === 'productive' ? 'var(--good)' : sum.verdict === 'average' ? 'var(--mid)' : 'var(--bad)';
  const lab = (v, txt) => { const [x,y] = pt(v, R-26); return `<text class="tlabel" x="${x.toFixed(1)}" y="${(y+3.5).toFixed(1)}" text-anchor="middle">${txt}</text>`; };
  const [ex, ey] = pt(val, R);
  return `<svg viewBox="0 0 260 260" aria-hidden="true">
    ${ticks}
    <path class="zone" d="${arc(0, avg, R+9)}" stroke="var(--bad)"/>
    <path class="zone" d="${arc(avg, prod, R+9)}" stroke="var(--mid)"/>
    <path class="zone" d="${arc(prod, 100, R+9)}" stroke="var(--good)"/>
    <path class="track" d="${arc(0, 100, R)}" stroke-width="12" stroke-linecap="round"/>
    ${val > 0.4 ? `<path class="prog" d="${arc(0, val, R)}" stroke="${col}" stroke-width="12"/>` : ''}
    <circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="4" fill="var(--surface)" stroke="${col}" stroke-width="2.5"/>
    ${lab(avg, String(s.avg))}${lab(prod, String(s.prod))}
  </svg>`;
}

      </button>

      ${open ? shown.map(t => rowHTML(t, ent(c, t.id))).join('') : ''}
    </div>`;
  });
  if (!any) {
    const msg = { pending:'Nothing left to do. Well spent.', done:'Nothing finished yet. Start a focus timer on any task.', unmeasured:'Every task has an assigned time.', all:'No tasks are scheduled for this day.' }[f];
    h += `<div class="empty">${msg}</div>`;

}
function rowHTML(t, e){

function toggleDone(id){

/* ---------- Wake-up ---------- */
function wakeSheet(edit){

  const base = edit && c ? new Date(c.start) : new Date();
  openSheet(shHead(edit ? 'Correct wake-up time' : 'Log new wake-up',
    edit ? 'Fixes when this day began. The previous day ends at the corrected time.' : 'The current day closes at this time and a new day begins.') +
    `<div class="two"><label class="f"><span>Date</span><input type="date" id="w-date" value="${ymd(base)}"></label>
     <label class="f"><span>Time</span><input type="time" id="w-time" value="${hm(base)}"></label></div>
     <div class="sh-foot"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" id="w-ok">${edit ? 'Save time' : 'Start new day'}</button></div>`,
    b => { $('#w-ok', b).onclick = () => {
      const d = $('#w-date').value, tm = $('#w-time').value;
      if (!d || !tm) { toast('Pick a date and time'); return; }
      const ts = toTs(d, tm);
      if (ts > Date.now() + 60000) { toast("Wake-up time can't be in the future"); return; }
      if (edit) {
        const prev = S.cycles[S.cycles.length-2];
        if (prev && ts <= prev.start) { toast('That is before the previous day began'); return; }
        c.start = ts;
        if (prev && prev.end) { prev.end = ts; prev.final = finalFromItems(prev); }
      } else {
        if (c) {
          if (ts <= c.start) { toast(`Must be after ${fmtTime(c.start)}, ${fmtDate(c.start)}`); return; }
          closeCycle(c, ts);
          const fin = c.final;
          setTimeout(() => toast(`Previous day closed at ${fmtScore(fin)}: ${VLABEL[fin.verdict]}`), 300);
        }
        S.cycles.push({ id:uid(), start:ts, end:null, entries:{} });
        S.ui.filter = 'pending';
      }
      save(true); closeSheet(); renderAll();
    }; });
}
function startDay(){
  const d = $('#o-date').value, tm = $('#o-time').value;
  if (!d || !tm) { toast('Pick a date and time'); return; }
  const ts = toTs(d, tm);
  if (ts > Date.now() + 60000) { toast("Wake-up time can't be in the future"); return; }
  const last = S.cycles[S.cycles.length-1];
  if (last && last.end && ts < last.end) { toast('That overlaps your previous day'); return; }

}

function updateTimer(){
  const T = S.timer, mini = $('#mini');
  $('#navdot').hidden = !T;
  if (!T) { mini.hidden = true; return; }
  const el = tElapsed(); let txt, prog, sub;
  if (T.mode === 'focus') {
    const rem = T.target - el;
    txt = fmtClock(Math.ceil(rem/1000)*1000); prog = Math.min(1, el / T.target);
    sub = T.running ? `${fmtClock(el)} focused` : 'Paused';
  } else { txt = fmtClock(el); prog = (el % 60000) / 60000; sub = T.running ? 'Counting up' : 'Paused'; }
  $$('[data-tclock]').forEach(n => { if (n.textContent !== txt) n.textContent = txt; });
  $$('[data-tsub]').forEach(n => n.textContent = sub);
  const rp = $('#rp'); if (rp) rp.setAttribute('stroke-dashoffset', (RC*(1-prog)).toFixed(1));
  mini.hidden = curTab === 'focus';
  if (!mini.hidden) {
    const t = T.tid ? taskById(T.tid) : null;
    $('#mini-name').textContent = (T.mode === 'focus' ? '' : 'Stopwatch: ') + (t ? t.name : 'Free stopwatch');
    const pp = $('#mini-pp'); const want = T.running ? 'p' : 'r';
    if (pp.dataset.s !== want) { pp.dataset.s = want; pp.innerHTML = T.running ? I.pause : I.play; pp.setAttribute('aria-label', T.running ? 'Pause' : 'Resume'); }
  }
}
function watchSaveSheet(){
  const T = S.timer; if (!T) return;
  pauseT();
  const sec = tElapsed() / 1000, c = cur();
  const mins = Math.max(1, Math.round(sec/60));
  const t = T.tid ? taskById(T.tid) : null;
  const opts = S.tasks.filter(x => !x.archived).sort((a,b) => (a.minutes?1:0) - (b.minutes?1:0))
    .map(x => `<option value="${x.id}">${esc(x.name)}${x.minutes ? ` (${x.minutes}m)` : ''}</option>`).join('');
  openSheet(shHead('Save this measurement', `You took ${fmtClock(sec*1000)}.`) +
    (t ? '' : `<label class="f"><span>Which task was this?</span><select id="ws-task">${opts}</select></label>`) +
    `<label class="f"><span>Assigned time (minutes)</span><input type="number" id="ws-min" min="1" step="1" value="${mins}" inputmode="numeric"></label>
     <p class="hint" id="ws-pts"></p>
     ${c ? `<label class="check"><input type="checkbox" id="ws-count" checked> Count this session as done today</label>` : `<p class="hint">No day is running, so this only sets the assigned time.</p>`}
     <div class="sh-foot"><button class="btn danger" id="ws-disc">Discard</button><button class="btn" id="ws-ok">Save time</button></div>`,
    b => {
      const upd = () => { const m = +$('#ws-min').value || 0; $('#ws-pts').textContent = m > 0 ? `Worth ${fp(m / S.settings.mpp)} pt each time you finish it on the timer.` : ''; };
      $('#ws-min').oninput = upd; upd();
      $('#ws-disc').onclick = () => { discardT(); closeSheet(); toast('Stopwatch discarded'); };
      $('#ws-ok').onclick = () => {
        const m = Math.round(+$('#ws-min').value);
        if (!(m >= 1)) { toast('Enter at least 1 minute'); return; }
        const id = t ? t.id : $('#ws-task').value; const task = taskById(id);
        if (!task) { toast('Pick a task'); return; }
        task.minutes = m;
        const cc = cur();
        if (cc && $('#ws-count') && $('#ws-count').checked) {
          const e = ent(cc, id, true); e.sec += sec; e.done = true; e.via = true; e.skip = false;
          if (!cycleTasks(cc).includes(task)) e.added = true;
        }
        S.timer = null; letSleep(); save(true); closeSheet(); renderAll();
        toast(`${task.name}: ${m} min assigned`);
      };
    });
}

/* ---------- Task & category forms ---------- */
function taskForm(id, presetCat, forToday){
  const t = id ? taskById(id) : null;
  const r = t ? JSON.parse(JSON.stringify(t.repeat || {type:'daily'})) : {type:'daily'};
  const c = cur(); const cd = c ? ymd(c.start) : ymd(new Date());
  if (!r.days) r.days = [parseYmd(cd).getDay()];
  if (!r.every) r.every = 2;
  if (!r.anchor) r.anchor = cd;
  if (!r.date) r.date = cd;
  if (!S.categories.length) S.categories.push({id:uid(), name:'General'});
  const catOpts = S.categories.map(k => `<option value="${k.id}"${(t ? t.catId : (presetCat || S.categories[0].id)) === k.id ? ' selected' : ''}>${esc(k.name)}</option>`).join('');
  openSheet(shHead(t ? 'Edit task' : 'New task') + `
    <label class="f"><span>Task</span><input type="text" id="tf-name" value="${t ? esc(t.name) : ''}" placeholder="e.g. Evening walk" maxlength="80"></label>
    <label class="f"><span>Category</span><select id="tf-cat">${catOpts}</select></label>
    <label class="f"><span>Assigned time (minutes)</span><input type="number" id="tf-min" min="1" step="1" inputmode="numeric" value="${t && t.minutes ? t.minutes : ''}" placeholder="Leave blank to measure first"></label>
    <p class="hint" id="tf-pts"></p>
    <label class="f"><span>Repeat</span><select id="tf-rep">
      <option value="daily">Every day</option><option value="weekly">On selected weekdays</option><option value="interval">Every few days</option><option value="once">One date only</option><option value="none">Don't repeat (add by hand)</option>
    </select></label>
    <div id="tf-extra"></div>
    ${c ? `<label class="check" id="tf-todaywrap"><input type="checkbox" id="tf-today"${forToday ? ' checked' : ''}> Also add to the current day's list</label>` : ''}
    <div class="sh-foot">${t ? `<button class="btn danger" id="tf-del">${I.trash} Delete</button>` : ''}<button class="btn" id="tf-ok">${t ? 'Save task' : 'Add task'}</button></div>`,
  b => {
    const rep = $('#tf-rep', b); rep.value = r.type;
    const extra = () => {
      const x = $('#tf-extra', b);
      if (r.type === 'weekly') {
        x.innerHTML = `<div class="days">${DOW.map((d,i) => `<button type="button" data-d="${i}" class="${r.days.includes(i)?'on':''}" aria-pressed="${r.days.includes(i)}">${d}</button>`).join('')}</div>`;
        $$('[data-d]', x).forEach(btn => btn.onclick = () => { const d = +btn.dataset.d; r.days = r.days.includes(d) ? r.days.filter(v => v !== d) : r.days.concat(d); extra(); todayCheck(); });
      } else if (r.type === 'interval') {
        x.innerHTML = `<div class="two"><label class="f"><span>Every (days)</span><input type="number" id="tf-every" min="2" step="1" value="${r.every}"></label><label class="f"><span>Starting</span><input type="date" id="tf-anchor" value="${r.anchor}"></label></div>`;
        $('#tf-every', x).oninput = e => { r.every = Math.max(1, Math.round(+e.target.value || 1)); todayCheck(); };
        $('#tf-anchor', x).oninput = e => { r.anchor = e.target.value || cd; todayCheck(); };
      } else if (r.type === 'once') {
        x.innerHTML = `<label class="f"><span>Date</span><input type="date" id="tf-date" value="${r.date}"></label>`;
        $('#tf-date', x).oninput = e => { r.date = e.target.value; todayCheck(); };
      } else x.innerHTML = '';
    };
    const todayCheck = () => {
      const w = $('#tf-todaywrap', b); if (!w) return;
      const sched = scheduled({repeat:r}, cd);
      const already = t && c.entries[t.id] && c.entries[t.id].added;
      w.hidden = sched;
      if (already) $('#tf-today', b).checked = true;
    };
    const pts = () => { const m = +$('#tf-min', b).value; $('#tf-pts', b).textContent = m > 0 ? `Worth ${fp(m / S.settings.mpp)} pt when finished on the focus timer.` : 'Blank means not measured yet. Use the stopwatch to find the time.'; };
    rep.onchange = () => { r.type = rep.value; extra(); todayCheck(); };
    $('#tf-min', b).oninput = pts;
    extra(); todayCheck(); pts();
    if (!t) setTimeout(() => $('#tf-name', b).focus(), 250);
    if (t) $('#tf-del', b).onclick = () => confirmSheet('Delete this task?', `"${esc(t.name)}" leaves your list. Past days keep their scores.`, 'Delete task', () => {
      if (S.timer && S.timer.tid === t.id) discardT();
      t.archived = true; save(true); closeSheet(); renderAll(); toast('Task deleted');
    });
    $('#tf-ok', b).onclick = () => {
      const name = $('#tf-name', b).value.trim();
      if (!name) { toast('Give the task a name'); return; }
      if (r.type === 'weekly' && !r.days.length) { toast('Pick at least one weekday'); return; }
      if (r.type === 'once' && !r.date) { toast('Pick a date'); return; }
      const mv = $('#tf-min', b).value.trim();
      const minutes = mv === '' ? null : Math.round(+mv);
      if (minutes !== null && !(minutes >= 1)) { toast('Minutes must be 1 or more'); return; }
      const repeat = { type:r.type };
      if (r.type === 'weekly') repeat.days = r.days.slice().sort();
      if (r.type === 'interval') { repeat.every = r.every; repeat.anchor = r.anchor; }
      if (r.type === 'once') repeat.date = r.date;
      let task = t;
      if (task) Object.assign(task, { name, catId:$('#tf-cat', b).value, minutes, repeat });
      else { task = { id:uid(), catId:$('#tf-cat', b).value, name, minutes, repeat, archived:false, created:Date.now() }; S.tasks.push(task); }
      if (c) {
        const box = $('#tf-today', b), w = $('#tf-todaywrap', b);
        if (box && w && !w.hidden) { if (box.checked) ent(c, task.id, true).added = true; else if (c.entries[task.id]) c.entries[task.id].added = false; }
        if (box && box.checked) S.ui.open[task.catId] = true;
      }
      save(true); closeSheet(); renderAll(); toast(t ? 'Task saved' : 'Task added');
    };
  });
}
function catForm(cid){
  const k = cid ? catById(cid) : null;
  const idx = k ? S.categories.indexOf(k) : -1;
  const n = k ? S.tasks.filter(t => !t.archived && t.catId === k.id).length : 0;

    ${k ? `<div class="acts" style="margin-bottom:14px">

      <button class="act danger" id="cf-del">${I.trash}<span>Delete category<small>Also deletes its ${n} task${n===1?'':'s'}</small></span></button></div>` : ''}
    <div class="sh-foot"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" id="cf-ok">${k ? 'Save name' : 'Add category'}</button></div>`,
  b => {

    if (k) {
      $('#cf-add', b).onclick = () => taskForm(null, k.id, !!cur());
      if ($('#cf-up', b)) $('#cf-up', b).onclick = () => mv(-1);
      if ($('#cf-down', b)) $('#cf-down', b).onclick = () => mv(1);
      $('#cf-del', b).onclick = () => confirmSheet('Delete this category?', `"${esc(k.name)}" and its ${n} task${n===1?'':'s'} will be removed. Past days keep their scores.`, 'Delete', () => {
        if (S.timer && S.timer.tid && (taskById(S.timer.tid)||{}).catId === k.id) discardT();
        S.tasks.forEach(t => { if (t.catId === k.id) t.archived = true; });
        S.categories = S.categories.filter(x => x !== k);
        save(true); closeSheet(); renderAll(); toast('Category deleted');
      });
    }
    $('#cf-ok', b).onclick = () => {
      const name = $('#cf-name', b).value.trim();
      if (!name) { toast('Give the category a name'); return; }
      if (S.categories.some(x => x !== k && x.name.toLowerCase() === name.toLowerCase())) { toast('That category already exists'); return; }
      if (k) k.name = name; else { const nk = {id:uid(), name}; S.categories.push(nk); S.ui.libOpen[nk.id] = true; }
      save(true); closeSheet(); renderAll(); toast(k ? 'Category renamed' : 'Category added');
    };
  });
}

/* ---------- Library ---------- */

/* ---------- History ---------- */
let calM = null;
function dayMap(){
  const m = {};
  S.cycles.forEach(c => { m[ymd(c.start)] = c; });
  return m;
}
function calHTML(){
  const now = new Date();
  if (!calM) calM = new Date(now.getFullYear(), now.getMonth(), 1);
  const y = calM.getFullYear(), mo = calM.getMonth();
  const first = new Date(y, mo, 1).getDay(), days = new Date(y, mo+1, 0).getDate();
  const map = dayMap(), today = ymd(now);
  const title = calM.toLocaleDateString('en-GB', {month:'long', year:'numeric'});
  let g = DOW.map(d => `<div class="cal-w">${d.slice(0,2)}</div>`).join('');
  for (let i = 0; i < first; i++) g += '<div class="cd pad"></div>';
  const monthDays = [];
  for (let d = 1; d <= days; d++) {
    const key = y + '-' + pad(mo+1) + '-' + pad(d), c = map[key];
    let cls = 'cd', inner = `<span class="dn">${d}</span>`, act = '';
    if (key === today) cls += ' today';
    if (key > today) cls += ' fut';
    if (c) {
      const f = summarize(c);
      cls += c.end ? ' v-' + f.verdict : ' live';
      inner += `<span class="sc">${(Math.round(f.score*10)/10).toFixed(1)}</span>`;
      act = c.end ? ` data-act="hist" data-cid="${c.id}"` : ` data-act="tab" data-tab="today"`;
      if (c.end) monthDays.push(f);
    }
    const label = `${d} ${title}${c ? `, ${fmtScore(summarize(c))}, ${VLABEL[summarize(c).verdict]}${c.end ? '' : ' so far'}` : ', no record'}`;
    g += c ? `<button class="${cls}"${act} aria-label="${label}">${inner}</button>` : `<div class="${cls}" aria-label="${label}">${inner}</div>`;
  }
  const atNow = y === now.getFullYear() && mo === now.getMonth();
  let h = `<div class="cal" id="cal">
    <div class="cal-h"><button class="ibtn prev" data-act="cal-m" data-d="-1" aria-label="Previous month">${I.chev}</button>
      <h2>${title}</h2>
      <button class="ibtn" data-act="cal-m" data-d="1" aria-label="Next month"${atNow ? ' disabled style="opacity:.3"' : ''}>${I.chev}</button></div>
    <div class="cal-g">${g}</div>
    <div class="cal-leg"><span><i style="background:var(--good)"></i>Productive</span><span><i style="background:var(--mid)"></i>Average</span><span><i style="background:var(--bad)"></i>Waste</span><span><i style="background:var(--accent-soft);border:1.5px dashed var(--accent)"></i>In progress</span></div>
  </div>`;
  const n = monthDays.length;
  const mean = n ? monthDays.reduce((a, f) => a + f.score, 0) / n : 0;
  const cnt = v => monthDays.filter(f => f.verdict === v).length;
  h += `<div class="msum"><div><b>${n ? (Math.round(mean*10)/10).toFixed(1) : '—'}</b><span>Month mean</span></div><div><b style="color:var(--good)">${cnt('productive')}</b><span>Productive</span></div><div><b style="color:var(--mid)">${cnt('average')}</b><span>Average</span></div><div><b style="color:var(--bad)">${cnt('waste')}</b><span>Waste</span></div></div>`;
  return h;
}
function renderHist(){
  const el = $('#tab-history');
  const closed = S.cycles.filter(c => c.end);
  const c = cur();
  let h = calHTML();
  if (!closed.length && !c) { el.innerHTML = h + `<div class="empty">Each day you log appears on the calendar, coloured by its verdict.</div>`; return; }
  if (closed.length) h += '<div class="hsec">Last 14 days</div>';
  const last = closed.slice(-14);
  if (last.length) {
    const W = 320, H = 150, top = 10, base = 118, n = last.length, bw = Math.min(26, (W-20)/n - 6);
    const y = v => base - Math.min(100, Math.max(0, v)) / 100 * (base - top);
    const s = S.settings;
    let bars = '';
    last.forEach((d, i) => {
      const f = d.final, x = 10 + i * ((W-20)/n) + ((W-20)/n - bw)/2;
      const col = f.verdict === 'productive' ? 'var(--good)' : f.verdict === 'average' ? 'var(--mid)' : 'var(--bad)';
      const yy = y(f.score);
      bars += `<rect x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(2, base-yy).toFixed(1)}" rx="3" fill="${col}"/>`;
      if (n <= 10 || i % 2 === n % 2) { const dt = new Date(d.start); bars += `<text x="${(x+bw/2).toFixed(1)}" y="${base+14}" text-anchor="middle">${dt.getDate()}/${dt.getMonth()+1}</text>`; }
    });
    h += `<div class="hchart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Scores of your last ${n} days">
      <line class="gl" x1="6" x2="${W-6}" y1="${y(s.prod)}" y2="${y(s.prod)}" stroke="var(--good)"/>
      <line class="gl" x1="6" x2="${W-6}" y1="${y(s.avg)}" y2="${y(s.avg)}" stroke="var(--mid)"/>
      <line x1="6" x2="${W-6}" y1="${base}" y2="${base}" stroke="var(--line)"/>
      ${bars}</svg></div>`;
    const avg = closed.reduce((a, d) => a + d.final.score, 0) / closed.length;
    const cnt = v => closed.filter(d => d.final.verdict === v).length;
    const avgTxt = (Math.round(avg*10)/10).toFixed(1);
    h += `<div class="hsum"><div><b>${avgTxt}</b><span>All-time mean</span></div><div><b style="color:var(--good)">${cnt('productive')}</b><span>Productive</span></div><div><b style="color:var(--mid)">${cnt('average')}</b><span>Average</span></div><div><b style="color:var(--bad)">${cnt('waste')}</b><span>Waste</span></div></div>`;
  }
  h += '<div class="hsec">All days</div><div class="hlist">';
  if (c) { const f = summarize(c); h += `<button class="hrow" data-act="tab" data-tab="today"><div class="hd"><b>${fmtDate(c.start)}</b><span>From ${fmtTime(c.start)}, in progress</span></div><div class="hs"><b>${fmtScore(f)}</b><span class="pill v-${f.verdict}">${VLABEL[f.verdict]} so far</span></div></button>`; }
  closed.slice().reverse().forEach(d => {
    const f = d.final;
    h += `<button class="hrow" data-act="hist" data-cid="${d.id}"><div class="hd"><b>${fmtDate(d.start)}</b><span>${fmtTime(d.start)} to ${fmtTime(d.end)}, ${fmtDur(d.end - d.start)}</span></div><div class="hs"><b>${fmtScore(f)}</b><span class="pill v-${f.verdict}">${VLABEL[f.verdict]}</span></div></button>`;
  });
  el.innerHTML = h + '</div>';
}
function histSheet(cid){
  const d = S.cycles.find(x => x.id === cid); if (!d) return;
  const f = d.final, items = d.items || [];
  const worked = items.filter(i => i.done || i.sec > 0).sort((a,b) => b.pts - a.pts);

     <div class="stats" style="margin-bottom:16px"><div class="stat"><b>${fp(f.earned)}</b><span>Pts earned</span></div><div class="stat"><b>${f.done}/${f.total}</b><span>Tasks done</span></div><div class="stat"><b>${fmtDur(f.sec*1000)}</b><span>Focused</span></div></div>
     <div class="sect">Worked on (${worked.length})</div>

     <div class="sect">Not done (${missed.length})</div>

     <div class="sh-foot"><button class="btn danger" id="hs-del">${I.trash} Delete this day</button><button class="btn ghost" data-act="close">Close</button></div>`,

      S.cycles = S.cycles.filter(x => x !== d); save(true); closeSheet(); renderAll(); toast('Day deleted'); }); });
}

      <button class="act" id="st-copy">${I.copy}<span>Copy backup to clipboard</span></button>
      <button class="act" id="st-dl">${I.down}<span>Download backup file</span></button>
      <button class="act" id="st-imp">${I.up}<span>Restore from backup<small>Paste backup text or pick a file</small></span></button>
      <button class="act danger" id="st-reset">${I.trash}<span>Erase everything<small>Restores your original task list</small></span></button>
    </div>`,
  b => {
    const rate = () => { const v = +$('#st-ppd', b).value; $('#st-rate', b).textContent = v > 0 ? `1 point = ${fmtMpp(1440/v)} min, 1 min = ${(v/1440).toFixed(7)} points` : ''; };
    $('#st-ppd', b).oninput = rate; rate();
    $('#st-ok', b).onclick = () => {
      const pd = +$('#st-ppd', b).value, prod = Math.round(+$('#st-prod', b).value), avg = Math.round(+$('#st-avg', b).value);
      if (!(pd >= 1)) { toast('Points for 24 hours must be 1 or more'); return; }
      const mpp = 1440 / pd;
      if (!(prod > avg && avg >= 0)) { toast('Productive must start above Average'); return; }
      Object.assign(s, { mpp, prod, avg, requireFocus:$('#st-rf', b).checked, sound:$('#st-snd', b).checked, vibrate:$('#st-vib', b).checked, awake:$('#st-awk', b).checked });
      if (!s.awake) letSleep(); else keepAwake();
      save(true); closeSheet(); renderAll(); toast('Settings saved');
    };
    const dump = () => JSON.stringify(S);
    $('#st-copy', b).onclick = async () => {
      try { await navigator.clipboard.writeText(dump()); toast('Backup copied'); }
      catch(e) { openSheet(shHead('Copy this backup') + `<textarea id="bk" readonly>${esc(dump())}</textarea><p class="hint" style="margin-top:8px">Select all and copy it somewhere safe.</p>`, bb => { const ta = $('#bk', bb); ta.focus(); ta.select(); }); }
    };
    $('#st-dl', b).onclick = () => {
      try {
        const blob = new Blob([dump()], {type:'application/json'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
        a.download = 'hisaab-backup-' + ymd(new Date()) + '.json';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        toast('Backup file prepared. If nothing downloaded, use Copy instead.');
      } catch(e) { toast('Download is blocked here. Use Copy instead.'); }
    };
    $('#st-imp', b).onclick = importSheet;
    $('#st-reset', b).onclick = () => confirmSheet('Erase everything?', 'All days, scores, times and your edits are deleted, and the original checklist comes back.', 'Erase all', () => {
      S = defaults(); seed(S); letSleep(); save(true); applyTheme(); closeSheet(); renderAll(); toast('Fresh start');
    });
  });
}
function importSheet(){
  openSheet(shHead('Restore from backup', 'This replaces everything currently in the app.') +
    `<label class="f"><span>Paste backup text</span><textarea id="im-t" placeholder='{"v":1,...}'></textarea></label>
     <label class="f"><span>Or choose a backup file</span><input type="file" id="im-f" accept=".json,application/json,text/plain" style="height:auto;padding:10px 0"></label>
     <div class="sh-foot"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" id="im-ok">Restore</button></div>`,
  b => {
    $('#im-f', b).onchange = e => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { $('#im-t', b).value = rd.result; }; rd.readAsText(f); };
    $('#im-ok', b).onclick = () => {
      let d; try { d = JSON.parse($('#im-t', b).value); } catch(e) { toast("That isn't a valid backup"); return; }
      if (!d || !Array.isArray(d.tasks) || !Array.isArray(d.categories) || !Array.isArray(d.cycles)) { toast("That isn't a Hisaab backup"); return; }
      const def = defaults();
      S = Object.assign(def, d); S.settings = Object.assign(defaults().settings, d.settings||{}); S.ui = Object.assign(defaults().ui, d.ui||{});
      save(true); applyTheme(); closeSheet(); renderAll(); toast('Backup restored');
    };
  });
}

/* ---------- Render & events ---------- */
function renderAll(){ renderToday(); renderFocus(); renderLib(); renderHist(); updateTimer(); }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id, cid = b.dataset.cid;
  switch (a) {
    case 'tab': if (sheetOpen) closeSheet(); showTab(b.dataset.tab); break;
    case 'close': closeSheet(); break;
    case 'theme': S.settings.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; applyTheme(); save(); break;
    case 'settings': settingsSheet(); break;
    case 'start-day': startDay(); break;
    case 'wake': wakeSheet(false); break;
    case 'wake-edit': wakeSheet(true); break;
    case 'chk': toggleDone(id); break;
    case 'row': taskSheet(id); break;
    case 'go': { const t = taskById(id); if (t && t.minutes) startFocus(id); else startWatch(id); break; }
    case 'cat': S.ui.open[cid] = !S.ui.open[cid]; save(); renderToday(); break;
    case 'toggle-all': { const all = S.categories.every(k => S.ui.open[k.id]); S.categories.forEach(k => S.ui.open[k.id] = !all); save(); renderToday(); break; }
    case 'filter': S.ui.filter = b.dataset.f; save(); renderToday(); break;
    case 'add-task': taskForm(null, cid, !!b.dataset.today && !!cur()); break;
    case 'add-cat': catForm(null); break;
    case 'edit-task': taskForm(id); break;
    case 'edit-cat': catForm(cid); break;
    case 'lib-cat': S.ui.libOpen[cid] = !S.ui.libOpen[cid]; save(); renderLib(); break;
    case 'hist': histSheet(cid); break;
    case 'cal-m': { const d = +b.dataset.d, n = new Date(calM.getFullYear(), calM.getMonth() + d, 1), now = new Date();
      if (n > new Date(now.getFullYear(), now.getMonth(), 1)) break; calM = n; renderHist(); break; }
    case 't-pause': pauseT(); break;
    case 't-resume': resumeT(); break;
    case 't-pp': S.timer && (S.timer.running ? pauseT() : resumeT()); break;
    case 't-done': { if (!S.timer) break; const t = taskById(S.timer.tid); endFocus(true); toast(`${t ? t.name : 'Task'} done, +${fp(taskPts(t))} pt`); break; }
    case 't-stop': { if (!S.timer) break; const t = taskById(S.timer.tid); const el = Math.min(tElapsed(), S.timer.target); endFocus(false); toast(`Saved ${fmtDur(el)} on ${t ? t.name : 'task'}`); break; }
    case 't-watch': startWatch(null); break;
    case 't-watchstop': watchSaveSheet(); break;
    case 't-discard': confirmSheet('Discard this timer?', 'The time on it will not be saved.', 'Discard', () => { discardT(); closeSheet(); }); break;
  }
});
(() => { let x0 = null, y0 = 0;
  $('#tab-history').addEventListener('touchstart', e => { if (!e.target.closest('#cal')) { x0 = null; return; } x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
  $('#tab-history').addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) { const btn = $(`[data-act="cal-m"][data-d="${dx < 0 ? 1 : -1}"]`); if (btn && !btn.disabled) btn.click(); } }, {passive:true});
})();
$('#libq').addEventListener('input', e => { libQ = e.target.value; renderLib(); });
window.addEventListener('scroll', () => $('#top').classList.toggle('scrolled', window.scrollY > 4), {passive:true});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { tick(); keepAwake(); if (curTab === 'today') renderToday(); } else save(true); });
window.addEventListener('pagehide', () => save(true));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheetOpen) closeSheet(); });

/* ---------- Boot ---------- */
load();
$$('[data-i]').forEach(s => { s.outerHTML = I[s.dataset.i]; });
applyTheme();
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!S.settings.theme) applyTheme(); }); } catch(e){}
if (S.timer && S.timer.mode === 'focus' && S.timer.running && tElapsed() >= S.timer.target) {
  const t = taskById(S.timer.tid); endFocus(true);
  setTimeout(() => toast(`${t ? t.name : 'A task'} finished while you were away, +${fp(taskPts(t))} pt`), 400);
}
renderAll();
if (S.timer && S.timer.running) keepAwake();
setInterval(tick, 500);
setInterval(() => { if (curTab === 'today' && !sheetOpen && cur()) renderToday(); }, 60000);
})();
</script>
</body>
</html>
